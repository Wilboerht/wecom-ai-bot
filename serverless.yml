component: scf
name: wecom-ai-bot
inputs:
  name: wecom-ai-bot
  src:
    src: ./
    exclude:
      - .env
      - .env.example
      - .git
      - .gitignore
      - tests
      - __pycache__
      - .pytest_cache
      - .venv
      - venv
      - .coverage
      - htmlcov
  region: ap-guangzhou
  runtime: Python3.10
  handler: main.main_handler
  memorySize: 512
  timeout: 30
  environment:
    variables:
      WECOM_CORP_ID: ${env:WECOM_CORP_ID}
      WECOM_AGENT_ID: ${env:WECOM_AGENT_ID}
      WECOM_SECRET: ${env:WECOM_SECRET}
      WECOM_TOKEN: ${env:WECOM_TOKEN}
      WECOM_ENCODING_AES_KEY: ${env:WECOM_ENCODING_AES_KEY}
      DEEPSEEK_API_KEY: ${env:DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${env:DEEPSEEK_MODEL}
      SYSTEM_PROMPT: ${env:SYSTEM_PROMPT}
      SESSION_TTL: ${env:SESSION_TTL}
      LOG_LEVEL: ${env:LOG_LEVEL}
  triggers:
    - type: apigw
      parameters:
        serviceName: wecom-ai-bot
        protocols:
          - https
        endpoints:
          - path: /callback
            method: ANY
          - path: /health
            method: GET
