# ============================================================
# kf.nihplod.cn — 微信客服回调 + 内部 API (经 Cloudflare 回源)
#
# 1) SSL 证书使用 Cloudflare Origin Certificate:
#    Cloudflare 控制台 → SSL/TLS → Origin Server → Create Certificate,
#    将证书与私钥安装到以下路径 (pem 含证书链, key 为私钥):
#      /etc/nginx/ssl/origin.pem
#      /etc/nginx/ssl/origin.key
#    并将 Cloudflare SSL 模式设为 Full (Strict)。
# 2) Cloudflare 官方 IP 列表(如有更新请同步下方 set_real_ip_from):
#      https://www.cloudflare.com/ips/
# 3) 防火墙/安全组应仅放行 Cloudflare IP 回源 80/443,
#    避免绕过 Cloudflare 直接打源站。
# 4) /api/ 携带 x-internal-key 内部密钥, 仅在 443(SSL) 下开放,
#    80 端口对 /api/ 一律 403。
# ============================================================

# 限流: 每 IP 10r/s
limit_req_zone $binary_remote_addr zone=wecom_limit:10m rate=10r/s;

# Cloudflare 真实 IP (IPv4)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# Cloudflare 真实 IP (IPv6)
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 443 ssl;
    server_name kf.nihplod.cn;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    # 微信回调报文为 KB 级
    client_max_body_size 64k;

    # 企微/微信客服回调
    location /callback {
        limit_req zone=wecom_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /wx-callback {
        limit_req zone=wecom_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 内部 API（供 advisor 子站服务端调用，带 x-internal-key 校验）— 仅 443 开放
    location /api/ {
        limit_req zone=wecom_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # 短链跳转: /l/{code} → 真实购买链接
    location /l/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name kf.nihplod.cn;

    # 内部 API 禁止走明文 HTTP
    location /api/ {
        return 403;
    }

    # 其余路径跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
